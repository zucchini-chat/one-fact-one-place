[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "one-fact-one-place"
version = "0.1.0"
description = "A git pre-commit check that stops an AI agent's commit when it repeats a fact, leaves an old value behind or breaks a link"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.optional-dependencies]
tyaml = ["pyyaml"]

[project.scripts]
dupcheck-hook = "dupcheck_hook:run"
dupcheck-search = "dupcheck_search:main"
tyaml-check = "tyaml:main"

[tool.setuptools]
package-dir = {"" = "hooks"}
py-modules = ["dupcheck", "dupcheck_hook", "dupcheck_links", "dupcheck_search", "tyaml"]
